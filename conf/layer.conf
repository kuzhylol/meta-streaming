# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-streaming"
BBFILE_PATTERN_meta-streaming = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-streaming = "6"

LAYERDEPENDS_meta-streaming = "core"
LAYERSERIES_COMPAT_meta-streaming = "wrynose"
