MACHINE = "raspberrypi4-64"
TMPDIR .= "-${BB_CURRENT_MC}"

RPI_EXTRA_CONFIG += '\
dtoverlay=disable-bt \n \
dtoverlay=gc9a01.dtbo \n \
'

KERNEL_DEVICETREE:append = " overlays/gc9a01.dtbo"

PREFERRED_VERSION_linux-raspberrypi = "6.18%"

OVERRIDES:append = ":cst816x"

IMAGE_INSTALL:append = " cst816x"

IMAGE_BASENAME = "cst816x-image"
hostname:pn-base-files = "cst816x-image"
